[project]
name = "quantforge"
version = "0.1.0"
description = "MFAAT course trading platform (milestone M0: foundations)"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas>=2.2", "polars", "pyarrow", "duckdb", "pydantic>=2", "pydantic-settings",
  "scipy", "statsmodels", "arch",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "hypothesis", "mypy", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantforge"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]     # DTZ: flags naive datetimes

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["paper: needs a broker paper account (never run in CI)"]
addopts = "-m 'not paper'"
